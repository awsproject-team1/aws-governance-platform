# Secret Scan 설정.
#
# 기본 Rule Set을 그대로 사용하고, 확인된 오탐 하나만 값 단위로 좁게 예외 처리한다.
#
# 배경: `secret-scan.yml`은 `fetch-depth: 0`으로 저장소 이력을 스캔한다. 따라서
# 오탐이 한 번 commit되어 remote ref에서 도달 가능해지면, 그 commit이 자기 branch에
# 없는 PR의 Secret Scan까지 함께 실패한다.
#
# 아래 값은 Secret이 아니라 Governance Control Key다. Mapping되지 않은 Control이
# 거부되는지 확인하는 test 값이며, `generic-api-key` 규칙이 `control_key` 옆의
# 따옴표 문자열을 후보로 보아 오탐했다.
#
# 현재 작업 tree에는 이 값이 없다. 10자 미만(`s3.no.map`)으로 줄여 규칙이 매칭되지
# 않게 했으므로 앞으로 만들어지는 commit은 이 예외가 필요하지 않다. 이 항목은
# `feature/governance-domain-bootstrap`에 이미 남은 과거 commit 하나만 덮는다.
# 해당 branch가 Squash Merge된 뒤 삭제되면 그 commit은 도달 불가능해지므로 이
# 예외는 제거할 수 있다.
#
# 예외는 경로나 파일이 아니라 정확한 값으로만 지정한다. 경로 단위로 열어두면 그
# 파일에 들어오는 진짜 Secret까지 함께 통과하기 때문이다.

[extend]
useDefault = true

[allowlist]
description = "확인된 오탐: Secret이 아닌 Governance Control Key (과거 commit 한정)"
regexes = [
  '''s3\.unapproved\.threshold''',
]
