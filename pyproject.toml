[project]
name = "aws-governance-platform"
version = "0.0.0"
description = "Cloud governance and compliance agent platform"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
