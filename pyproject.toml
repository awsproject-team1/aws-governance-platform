[project]
name = "aws-governance-platform"
version = "0.0.0"
description = "Cloud governance and compliance agent platform"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100
# 구버전 문서 체계 스냅샷은 리포 밖에 두지만, 실수로 복사되어도 Lint 대상이 되지 않게 한다.
extend-exclude = ["before"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    # UP042는 `class X(str, Enum)`을 `StrEnum`으로 바꾸라고 제안한다. 적용하지 않는다.
    # 두 방식은 `str(X.MEMBER)` 결과가 다르고(`"X.MEMBER"` 대 `"MEMBER"`),
    # 그 값이 Contract 직렬화 경계에 걸린다. 전환하려면 Enum 표현을 함께 결정해야 한다.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["packages", "tools", "apps", "agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
