# Frontend 변경의 Node Test Gate.
#
# Python Gate는 python-checks.yml이 담당한다. Frontend만 바뀐 PR은 그 Path Filter에
# 걸리지 않으므로 별도 Workflow로 분리한다. Path Filter Workflow 자체는 Required Check로
# 직접 등록하지 않는다. 공통 PR Gate가 구현·검증된 뒤 결과를 종합하며, 그 전에는 기존
# Required Check를 제거하지 않고 적용되는 CI 성공을 사람의 Merge 조건으로 확인한다.
name: Frontend Checks

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "apps/frontend/**"
      - "tests/unit/*.mjs"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Run frontend model tests
        run: node --test tests/unit/test_policy_frontend.mjs
