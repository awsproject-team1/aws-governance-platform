name: Feature / Sub-issue
description: 실제 구현 가능한 기능 작업을 정의합니다.
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: "이 템플릿의 Parent 참조는 설명용입니다. Issue 생성 후 Parent의 Add sub-issue 기능으로 GitHub Native Sub-issue 관계를 반드시 연결합니다."
  - type: input
    id: parent
    attributes:
      label: Parent Issue reference
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 문제와 배경을 설명합니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 작업으로 달성할 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 포함/제외 범위와 예상 Directory/Module을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 구현, Test, 문서 완료 조건을 체크리스트로 작성합니다.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Related Domain
      multiple: true
      options:
        - A — Platform / API / Auth / Data
        - B — Governance / Policy / Knowledge
        - C — Agent Platform / Assessment
        - D — Remediation / IaC / GitHub / Deployment
        - Shared Contract / Integration / Docs
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Contract / Other Owner Impact
      description: Contract 영향과 다른 Owner 확인 필요 여부를 작성합니다.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Depends on / Blocks를 작성합니다.
  - type: textarea
    id: validation
    attributes:
      label: Test / Validation
      description: PR 전 로컬 검증과 PR 후 Required CI를 구분해 작성합니다.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "구현과 로컬 검증 후 dev 대상 PR을 생성합니다. 사람의 Review/Merge 후 dev 반영을 확인하고 Issue를 수동으로 닫은 다음 후속 Sub-issue를 시작합니다."
