name: Feature / Sub-issue
description: 실제 구현 가능한 기능 작업을 정의합니다.
title: "[Feature] "
labels: []
body:
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      placeholder: "#123"
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 문제와 배경을 설명합니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 작업으로 달성할 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 포함/제외 범위와 예상 Directory/Module을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 구현, Test, 문서 완료 조건을 체크리스트로 작성합니다.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Related Domain
      multiple: true
      options:
        - A — Platform / API / Auth / Data
        - B — Governance / Policy / Knowledge
        - C — Agent Platform / Assessment
        - D — Remediation / IaC / GitHub / Deployment
        - Shared Contract / Integration / Docs
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Contract / Other Owner Impact
      description: Contract 영향과 다른 Owner 확인 필요 여부를 작성합니다.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Depends on / Blocks를 작성합니다.
  - type: textarea
    id: validation
    attributes:
      label: Test / Validation
      description: 실행할 명령 또는 확인 절차를 작성합니다.
    validations:
      required: true
