name: Feature / Sub-issue
description: Parent Feature에 연결되는 실제 구현 가능한 작업을 정의합니다.
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: "이 Form은 `docs/COLLABORATION.md`의 Sub-issue 생명주기를 따릅니다. Issue 생성 후 Parent의 Add sub-issue 기능으로 GitHub Native 관계를 반드시 연결합니다. 이 Issue에는 단일 실행 Owner가 필요하며, 일반 PR은 최신 `dev`에서 만든 short-lived branch로 `dev`를 대상으로 합니다."
  - type: input
    id: parent
    attributes:
      label: Parent Issue reference
      placeholder: "#123"
      description: Parent 번호를 기록하고 GitHub Native Parent/Sub-issue 관계도 연결합니다.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Execution Owner
      description: 이 Sub-issue의 Scope, handoff, Done 확인을 책임질 사람 또는 GitHub Team을 적습니다.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Related Domain
      multiple: true
      options:
        - A — Platform / API / Auth / Data
        - B — Governance / Policy / Knowledge
        - C — Agent Platform / Assessment
        - D — Remediation / IaC / GitHub / Deployment
        - Shared Contract / Integration / Docs
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 문제와 배경을 설명합니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 작업으로 달성할 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Out of Scope
      description: 포함/제외 범위와 예상 Directory/Module을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Sub-issue Done Criteria
      description: 구현, Fixture/Test, 문서, Review/CI, 실제 통합 여부를 포함한 완료 조건을 체크리스트로 작성합니다.
    validations:
      required: true
  - type: dropdown
    id: dependency_status
    attributes:
      label: Dependency Status
      description: 현재 상태를 선택합니다. Blocked는 선행 작업 없이는 진행 불가, Mockable은 합의된 test double로 병렬 가능, Integrated는 실제 Producer 통합 검증 완료를 뜻합니다.
      options:
        - None
        - Blocked
        - Mockable
        - Integrated
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Blocks
      description: Depends on / Provides to / Blocks, 관련 Issue, Owner, 해소 조건을 작성합니다. Mockable이면 Fixture/Fake/Mock 경계와 실제 통합 조건도 기록합니다.
  - type: textarea
    id: contract
    attributes:
      label: Contract Impact / Producer / Consumer
      description: Contract Owner, Producer 변경안, Consumer 영향과 필요한 Review를 작성합니다. 영향이 없으면 없음이라고 기록합니다.
    validations:
      required: true
  - type: textarea
    id: open_decision
    attributes:
      label: Open Decision (해당 시)
      description: Decision, Owner, Needed by, Blocks, Options, Final record 형식으로 작성합니다. 장기 영향 결정은 ADR도 연결합니다.
  - type: textarea
    id: validation
    attributes:
      label: Test / Validation
      description: PR 전 로컬 검증, PR 후 적용 CI, 통합 검증, 미실행 항목과 사유를 구분해 작성합니다.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "`Closes #이슈번호`는 이 PR merge로 Sub-issue Done Criteria를 모두 충족할 때만 사용합니다. 기반 작업·부분 구현·조사처럼 Issue를 열어 두어야 하면 `Refs #이슈번호`를 사용합니다. Agent는 사람의 명시적 요청 없이 Issue 상태를 변경하지 않습니다. 사람은 merge 뒤 GitHub의 자동 종료 또는 수동 상태 갱신을 확인하고 Parent/Project 상태를 정리합니다."