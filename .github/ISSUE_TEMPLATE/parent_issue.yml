name: Parent Feature
description: A/B/C/D 영역의 목표, 범위, 진행률을 관리합니다.
title: "[Parent] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - A — Platform / API / Auth / Data
        - B — Governance / Policy / Knowledge
        - C — Agent Platform / Assessment
        - D — Remediation / IaC / GitHub / Deployment
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 Parent Feature가 제공할 기능과 사용자 가치를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 포함 및 제외 범위를 구분해 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 완료를 검증할 수 있는 조건을 체크리스트로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 주요 산출물
      description: 기능, Contract, Test, Frontend, 문서 산출물을 작성합니다.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Depends on / Provides to를 작성합니다.
  - type: markdown
    attributes:
      value: "Parent Issue에는 전용 branch/PR과 Milestone을 만들지 않습니다. 실제 작업은 GitHub Native Sub-issue로 연결하며 Native progress를 진행률 정본으로 사용합니다. 완료 가능한 Sub-issue PR은 기본 브랜치인 dev를 대상으로 `Closes #이슈번호`를 사용하고, 사람의 Review/Merge 후 GitHub가 자동으로 Sub-issue를 닫습니다. Parent 통합 검증도 마지막 Native Sub-issue로 같은 절차를 적용합니다. 모든 Sub-issue가 종료되어 progress가 100%가 되면 사람이 Parent의 전체 Acceptance Criteria와 주요 산출물을 종합 검증하고 Parent를 종료합니다. Parent Issue는 PR closing keyword로 닫지 않습니다."
