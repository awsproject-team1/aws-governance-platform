name: Parent Feature
description: A/B/C/D가 함께 완료할 기능 목표와 통합 기준을 관리합니다.
title: "[Parent] "
labels: []
body:
  - type: markdown
    attributes:
      value: "이 Form은 `docs/COLLABORATION.md`의 Parent Feature 생명주기를 따릅니다. Parent는 목표·통합·완료 기준을 관리하고, 실제 구현은 GitHub Native Sub-issue 또는 Bug Issue로 분리합니다. Parent에는 전용 구현 branch나 PR closing keyword를 사용하지 않습니다."
  - type: dropdown
    id: area
    attributes:
      label: Primary Owner 영역
      description: Parent Feature의 최종 통합을 책임질 주 담당 영역을 선택합니다.
      options:
        - A — Platform / API / Auth / Data
        - B — Governance / Policy / Knowledge
        - C — Agent Platform / Assessment
        - D — Remediation / IaC / GitHub / Deployment
        - Shared — Cross-owner Integration
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Parent Owner
      description: Parent Feature Done 확인, handoff, 상태 갱신을 책임질 사람 또는 GitHub Team을 적습니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 Parent Feature가 제공할 사용자 가치와 목표를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Out of Scope
      description: 포함 범위와 이번 Parent에서 명시적으로 제외할 범위를 구분해 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Parent Feature Done Criteria
      description: 모든 필수 Sub-issue/Bug Done, 통합 Acceptance, Consumer 확인, 통합 검증 조건을 체크리스트로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: subissues
    attributes:
      label: Required Sub-issues / Bugs
      description: 생성 후 GitHub의 Add sub-issue로 실제 Native 관계를 연결합니다. 필수 항목과 선택 항목을 구분해 기록합니다.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract / Other Owner Impact
      description: 영향을 받는 Contract Owner, Producer, Consumer와 필요한 공동 검토를 작성합니다.
  - type: dropdown
    id: dependency_status
    attributes:
      label: Dependency Status
      description: Parent의 집계 의존성 상태를 선택합니다. 하나라도 해소되지 않은 차단 요인이 있으면 반드시 Blocked를 선택하고, 상태별 사유와 해소 조건은 아래에 작성합니다.
      options:
        - None
        - Blocked
        - Mockable
        - Integrated
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Blocks
      description: Depends on, Provides to, Blocked 사유, Owner, 해소 조건과 Mock/실제 통합 조건을 작성합니다.
  - type: textarea
    id: open_decision
    attributes:
      label: Open Decision (해당 시)
      description: Decision, Owner, Needed by, Blocks, Options, Final record 형식으로 작성합니다. 장기 영향 결정은 ADR도 연결합니다.
  - type: input
    id: milestone
    attributes:
      label: Milestone / Release or Demo Target
      description: 해당 시 GitHub Milestone 또는 Release/Demo 목표를 기록합니다.
  - type: markdown
    attributes:
      value: "Sub-issue Done은 해당 Scope·Acceptance·Validation을 충족한 `dev` PR이 Review와 적용 CI를 통과해 merge된 상태입니다. 모든 필수 Sub-issue/Bug가 Done이고 Parent 수준에도 해소되지 않은 `Blocked` 의존성이 없으며 통합 기준을 충족하면 Parent Owner가 Parent Feature Done을 확인해 닫습니다. `dev → main` 통합 PR 및 Release/Demo 검증은 Parent Done 이후의 별도 단계입니다."